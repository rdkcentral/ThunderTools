name: ProxyStub & JSON-RPC Generator Functional Tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - "ProxyStubGenerator/**"
      - "JsonGenerator/**"
      - ".github/workflows/ProxyStubFunctionalTests.yml"
  pull_request:
    branches: [ master ]
    paths:
      - "ProxyStubGenerator/**"
      - "JsonGenerator/**"
      - ".github/workflows/ProxyStubFunctionalTests.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Build type - ${{ matrix.architecture == '32' && 'x86' || 'x86_64' }}
    strategy:
      matrix:
        architecture: [32, 64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare apt (add i386 if needed)
        if: ${{ matrix.architecture == '32' }}
        run: |
          sudo dpkg --add-architecture i386

      - name: Update apt indices (with retries)
        shell: bash
        run: |
          set -euo pipefail
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ConnectTimeout=10 -o Dpkg::Lock::Timeout=60"
          MIRRORS=("archive.ubuntu.com/ubuntu" "mirror.ubuntu.com/ubuntu")
          mirror_index=-1
          switch_ubuntu_mirror() {
            local mirror="${MIRRORS[$mirror_index]}"
            echo "Switching Ubuntu mirror to http://${mirror}"
            for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source_file" ]; then
                sudo sed -i -E "s#^(URIs:[[:space:]]+|deb[[:space:]]+)[^[:space:]]+#\1http://${mirror}#" "$source_file"
              fi
            done
          }
          updated=0
          for attempt in {1..6}; do
            if [ "$attempt" -gt 2 ] && [ $(( (attempt - 1) % 2 )) -eq 0 ]; then
              mirror_index=$((mirror_index + 1))
              switch_ubuntu_mirror
            fi
            if timeout 300s sudo apt-get update ${APT_OPTS}; then
              updated=1
              break
            fi
            echo "apt-get update failed (attempt $attempt), retrying..."
            sleep $((attempt*10))
          done
          if [ "$updated" -ne 1 ]; then
            echo "apt-get update failed after trying 3 Ubuntu mirrors"
            exit 1
          fi

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ConnectTimeout=10 -o Dpkg::Lock::Timeout=60"
          MIRRORS=("archive.ubuntu.com/ubuntu" "mirror.ubuntu.com/ubuntu")
          mirror_index=-1
          switch_ubuntu_mirror() {
            local mirror="${MIRRORS[$mirror_index]}"
            echo "Switching Ubuntu mirror to http://${mirror}"
            for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source_file" ]; then
                sudo sed -i -E "s#^(URIs:[[:space:]]+|deb[[:space:]]+)[^[:space:]]+#\1http://${mirror}#" "$source_file"
              fi
            done
          }
          PKGS="python3-venv python3-pip build-essential cmake ninja-build libgtest-dev"
          if [ "${{ matrix.architecture }}" = "32" ]; then
            PKGS="$PKGS zlib1g-dev:i386 libssl-dev:i386 gcc-13-multilib g++-13-multilib"
          else
            PKGS="$PKGS zlib1g-dev libssl-dev"
          fi
          installed=0
          for attempt in {1..6}; do
            if [ "$attempt" -gt 2 ] && [ $(( (attempt - 1) % 2 )) -eq 0 ]; then
              mirror_index=$((mirror_index + 1))
              switch_ubuntu_mirror
            fi
            if timeout 300s sudo apt-get install -y --no-install-recommends ${APT_OPTS} $PKGS; then
              installed=1
              break
            fi
            echo "apt-get install failed (attempt $attempt), cleaning up & retrying..."
            sleep $((attempt*15))
          done
          if [ "$installed" -ne 1 ]; then
            echo "apt-get install failed after trying 3 Ubuntu mirrors"
            exit 1
          fi

      - name: Set up Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install jsonref

      - name: Build Functional Tests
        run: |
          source venv/bin/activate
          cmake \
            -G Ninja \
            -S . \
            -B Build/ThunderTools \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MESSAGE_LOG_LEVEL=VERBOSE \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DENABLE_TESTING=ON \
            -DFUNCTIONAL_TESTS=ON \
            -DENABLE_TEST_RUNTIME=ON \
            -DPROXYSTUB_GENERATOR=$(pwd)/ProxyStubGenerator/StubGenerator.py \
            -DJSON_GENERATOR=$(pwd)/JsonGenerator/JsonGenerator.py
          cmake \
            --build Build/ThunderTools \
            --target JsonRpcFunctionalTests ComRpcFunctionalTests

      - name: Run ProxyStub Functional Tests
        run: Build/ThunderTools/tests/FunctionalTests/comrpc/ComRpcFunctionalTests

      - name: Run JSON-RPC Functional Tests
        run: Build/ThunderTools/tests/FunctionalTests/jsonrpc/JsonRpcFunctionalTests
